name: Scheduled sync

# The backend has no cron/worker of its own, so the scheduler lives here.
# API_BASE_URL points at whichever deployment is current — see
# docs/DEPLOYMENT.md. The "wake" step is a no-op health check against an
# always-on host; it only mattered while API_BASE_URL pointed at a Render free
# instance that slept after 15 minutes idle.

on:
  schedule:
    # Every 12 hours. GitHub cron is UTC.
    - cron: '0 3,15 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Sync a single source only (blank = all enabled sources)'
        required: false
        type: string

concurrency:
  group: exhibition-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wake the service
        # A sleeping Render instance needs roughly 50s to boot. Poll rather
        # than sleeping a fixed amount so a warm service costs one request.
        run: |
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
              "${{ secrets.API_BASE_URL }}/health" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "service is awake"
              exit 0
            fi
            sleep 15
          done
          echo "service did not wake in time"
          exit 1

      - name: Trigger ingestion
        run: |
          # maxDetailFetches is capped so one run can never run long enough to
          # hit the timeout below: uncapped, the adapter enriches every listed
          # exhibition one at a time at 1 req/sec (see EventroSource), which on
          # a large or first-ever sync exceeds --max-time and gets aborted with
          # no result recorded. 150 covers the exhibitions nearest to today
          # (soonest-upcoming first, per the adapter's own priority order) well
          # within budget; older/further-out ones catch up over later runs.
          payload='{"maxDetailFetches":150}'
          if [ -n "${{ inputs.source }}" ]; then
            payload="{\"source\":\"${{ inputs.source }}\",\"maxDetailFetches\":150}"
          fi

          # The backend now runs on a server whose outbound path to its
          # database has an intermittent, unpredictable failure mode (some
          # connections to the DB provider's pooler silently hang and time
          # out — confirmed directly, and self-resolves on the next attempt).
          # A sync call landing during one of those windows fails with a 500
          # that has nothing to do with the sync itself, so retry a few times
          # before treating it as a real failure.
          for attempt in 1 2 3; do
            response=$(curl -s -w '\n%{http_code}' --max-time 900 \
              -X POST "${{ secrets.API_BASE_URL }}/api/v1/internal/sync" \
              -H 'Content-Type: application/json' \
              -H "X-Sync-Secret: ${{ secrets.SYNC_SECRET }}" \
              -d "$payload")

            body=$(echo "$response" | sed '$d')
            code=$(echo "$response" | tail -n1)

            echo "attempt $attempt -> HTTP $code"
            echo "$body"

            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              exit 0
            fi

            [ "$attempt" -lt 3 ] && sleep 15
          done

          exit 1
